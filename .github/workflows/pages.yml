# Publishes the practice portal (everything in public/) to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# After that, every push to main republishes the portal at
# https://<user>.github.io/<repo>/
name: Deploy practice portal

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it half way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
