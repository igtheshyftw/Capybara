<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ============================================================
   A working replica of one 20-question module of the 2026 TOEFL
   reading section: Complete the Words (Q1-10), Read in Daily
   Life (Q11-15), Read an Academic Passage (Q16-20).
   Palette taken from the live test chrome: deep teal on white.
   ============================================================ */
:root{
  --teal:#0e5a5e;
  --teal-2:#12706f;
  --teal-ink:#0b4a4d;
  --rule:#c9d2d3;
  --rule-2:#9fadaf;
  --ink:#16201f;
  --ink-2:#4a5654;
  --ink-3:#6f7b7a;
  --paper:#ffffff;
  --paper-2:#f4f7f7;
  --box:#d9dcdc;
  --mark:#0e6b6e;
  --ok:#1c6b46;
  --ok-soft:#e4f1ea;
  --no:#96271f;
  --no-soft:#f8e5e3;
  --sans:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#0b3f42; --teal-2:#0d5254; --teal-ink:#072e30;
    --rule:#2c3a3b; --rule-2:#4a5c5d;
    --ink:#e6eeed; --ink-2:#aebbba; --ink-3:#8493931;
    --ink-3:#849392;
    --paper:#141b1b; --paper-2:#1a2323; --box:#2f3a3a;
    --mark:#1c8c90; --ok:#6cc39a; --ok-soft:#16302a;
    --no:#e78e86; --no-soft:#331f1e;
  }
}
:root[data-theme="dark"]{
  --teal:#0b3f42; --teal-2:#0d5254; --teal-ink:#072e30;
  --rule:#2c3a3b; --rule-2:#4a5c5d;
  --ink:#e6eeed; --ink-2:#aebbba; --ink-3:#849392;
  --paper:#141b1b; --paper-2:#1a2323; --box:#2f3a3a;
  --mark:#1c8c90; --ok:#6cc39a; --ok-soft:#16302a;
  --no:#e78e86; --no-soft:#331f1e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}

/* ---------- chrome ---------- */
.bar{
  background:var(--teal);color:#fff;display:flex;align-items:center;gap:10px;
  padding:9px 18px;flex-wrap:wrap;
}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.brand span{opacity:.75;font-size:13px;vertical-align:2px}
.pill{
  appearance:none;cursor:pointer;background:var(--teal-2);color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:22px;
  padding:7px 16px;font-size:14px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px;
}
.pill:hover{background:#178285}
.pill[disabled]{opacity:.45;cursor:default}
.pill.primary{background:#fff;color:var(--teal-ink);border-color:#fff}
.pill.primary:hover{background:#eef5f5}
.subbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 18px;border-bottom:1px solid var(--rule);background:var(--paper);
}
.subbar .where{font-weight:700;color:var(--teal-ink);margin-right:auto;font-size:15px}
.subbar .where i{font-style:normal;color:var(--rule-2);margin:0 8px}
.clock{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.low{color:var(--no)}
.eye{
  appearance:none;background:none;border:0;cursor:pointer;color:var(--teal-2);
  font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;
}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
.bar :focus-visible{outline-color:#fff}

/* ---------- shared layout ---------- */
main{padding:22px 18px 90px}
.prompt{text-align:center;font-size:26px;font-weight:700;margin:14px 0 26px}
.ptitle{text-align:center;font-size:26px;font-weight:700;margin:10px 0 24px}
.two{display:grid;grid-template-columns:minmax(0,46%) minmax(0,54%);gap:36px;max-width:1180px;margin:0 auto}
.qcol .stem{font-weight:700;font-size:17px;margin:0 0 18px;max-width:52ch}
.opts{display:flex;flex-direction:column;gap:14px;max-width:56ch}
.opt{
  display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start;
  cursor:pointer;padding:3px 0;
}
.opt .dot{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--rule-2);
  margin-top:2px;display:grid;place-items:center;background:var(--paper);
}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt input:checked + .dot::after{
  content:"";width:10px;height:10px;border-radius:50%;background:var(--teal-2);
}
.opt:hover .dot{border-color:var(--teal-2)}
.opt .txt{padding-top:1px}

/* ---------- Complete the Words ---------- */
.ctw{max-width:980px;margin:120px auto 0;font-size:18px;line-height:2.3}
.cw{white-space:nowrap}
.cw .slot{position:relative;display:inline-block}
.cw input{
  background:var(--box);border:0;border-radius:2px;padding:1px 3px;
  font-size:18px;line-height:1.3;text-align:left;
}
.cw input:focus{outline:2px solid var(--teal-2);outline-offset:0}
.cw .dash{
  position:absolute;left:0;right:0;bottom:-6px;text-align:center;
  font-family:var(--mono);font-size:15px;line-height:1;color:var(--ink);
  letter-spacing:.5px;pointer-events:none;user-select:none;
}

/* ---------- daily life ---------- */
.doc{
  border:2px solid var(--rule-2);border-radius:3px;background:var(--paper);
  max-width:100%;
}
.doc .subj{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--rule)}
.doc .subj b{border:1px solid var(--ink-2);padding:2px 8px;font-size:14px;white-space:nowrap}
.doc .subj span{border:1px solid var(--ink-2);padding:2px 8px;font-size:15px;flex:1;min-width:0}
.doc .body{padding:14px 16px;max-height:420px;overflow-y:auto}
.doc .body p{margin:0 0 12px;font-size:15.5px;line-height:1.55}
.doc .body p:last-child{margin-bottom:0}
.doc.notice .hd{
  padding:12px 16px;border-bottom:1px solid var(--rule);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--teal-ink);
}

/* ---------- academic passage ---------- */
.pass{
  max-height:560px;overflow-y:auto;padding-right:20px;
  border-right:2px solid var(--rule);
  scrollbar-color:var(--rule-2) var(--paper-2);scrollbar-width:auto;
}
.pass p{margin:0 0 18px;font-size:16.5px;line-height:1.6}
.pass mark{background:var(--mark);color:#fff;padding:1px 3px;border-radius:2px}
.pass::-webkit-scrollbar{width:15px}
.pass::-webkit-scrollbar-track{background:var(--paper-2)}
.pass::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:8px;border:3px solid var(--paper-2)}

/* ---------- review + report ---------- */
.panel{max-width:900px;margin:0 auto}
.panel h1{font-size:27px;margin:0 0 6px}
.panel .lede{color:var(--ink-2);margin:0 0 22px;max-width:62ch}
.tableWrap{border:1px solid var(--rule);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--paper)}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule)}
th{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);background:var(--paper-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper-2)}
td.n{font-family:var(--mono);color:var(--ink-3);width:1%;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;padding:2px 8px}
.tag.done{background:#e1eeee;color:var(--teal-ink)}
.tag.none{background:var(--paper-2);color:var(--ink-3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--no-soft);color:var(--no)}
.score{display:flex;gap:30px;flex-wrap:wrap;align-items:baseline;border:1px solid var(--rule);border-left:5px solid var(--teal-2);padding:20px 24px;margin-bottom:24px}
.score .big{font-family:var(--mono);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score .cap{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.rep{border:1px solid var(--rule);border-left:5px solid var(--rule-2);padding:15px 20px;margin-bottom:12px}
.rep.right{border-left-color:var(--ok)}
.rep.wrong{border-left-color:var(--no)}
.rep-hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.rep-hd .n{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.rep-hd .ty{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-2);font-weight:700;margin-right:auto}
.rep p{margin:4px 0;font-size:15px}
.rep .yours{color:var(--no)}
.rep .right-ans{color:var(--ok)}

/* ---------- foot + help ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:9px 18px}
.foot-in{max-width:1180px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.status{font-size:14px;color:var(--ink-2)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot-b{width:24px;height:24px;border:1px solid var(--rule);background:var(--paper-2);font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer;border-radius:2px;padding:0}
.dot-b[data-done="1"]{background:var(--teal-2);border-color:var(--teal-2);color:#fff}
.dot-b[data-cur="1"]{outline:2px solid var(--ink);outline-offset:1px}
.scrim{position:fixed;inset:0;background:rgba(10,30,30,.6);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:var(--paper);border-radius:4px;max-width:620px;width:100%;max-height:86vh;overflow:auto}
.modal header{background:var(--teal);color:#fff;padding:12px 20px;font-weight:700}
.modal .body{padding:20px}
.modal h3{margin:16px 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.modal h3:first-child{margin-top:0}
.modal p,.modal li{font-size:15px;color:var(--ink-2);margin:0 0 8px}
.modal footer{padding:0 20px 20px;display:flex;justify-content:flex-end}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
  .two{grid-template-columns:1fr;gap:24px}
  .pass{max-height:300px;border-right:0;border-bottom:2px solid var(--rule);padding-right:0;padding-bottom:12px}
  .ctw{margin-top:24px;line-height:2.4}
  .prompt,.ptitle{font-size:21px}
}
</style>

const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- assemble one module: 10 + 5 + 5 ---------- */
function buildModule(){
  const ctw = pick(CONTENT.ctw);
  const daily = [], dq = [];
  for (const t of CONTENT.daily){
    daily.push(t);
    t.questions.forEach((q, i) => dq.push({text: t, q, n: i}));
    if (dq.length >= 5) break;
  }
  const ac = pick(CONTENT.academic);
  return {ctw, daily, dq: dq.slice(0, 5), ac, aq: ac.questions.slice(0, 5)};
}

let M = buildModule();
const S = {
  screen:"test", qi:1,
  typed: M.ctw.answers.map(() => ""),
  chosen: {},                 // question number 11-20 -> option index
  seconds: SECONDS, timeHidden:false, ended:false
};

const isCTW = n => n <= 10;
const dailyAt = n => M.dq[n - 11];
const acadAt  = n => M.aq[n - 16];
const answered = n => isCTW(n) ? S.typed[n - 1].trim() !== "" : S.chosen[n] !== undefined;

/* ---------- render ---------- */
function render(){
  if (S.screen === "review") renderReview();
  else if (S.screen === "report") renderReport();
  else if (isCTW(S.qi)) renderCTW();
  else if (S.qi <= 15) renderDaily();
  else renderAcademic();
  renderChrome();
  renderFoot();
}

function renderChrome(){
  const scored = S.screen === "report";
  $("where").textContent =
    S.screen === "review" ? "Review" :
    scored ? "Score report" :
    isCTW(S.qi) ? "Questions 1–10 of 20" : `Question ${S.qi} of ${TOTAL}`;
  $("bBack").disabled = S.screen !== "test" || S.qi <= 1;
  $("bReview").disabled = scored;
  $("bNext").innerHTML = scored ? "New module <b aria-hidden=\"true\">&rsaquo;</b>"
    : S.screen === "review" ? "End Section <b aria-hidden=\"true\">&rsaquo;</b>"
    : "Next <b aria-hidden=\"true\">&rsaquo;</b>";
  const c = $("clock");
  c.style.display = scored ? "none" : "";
  $("bTime").style.display = scored ? "none" : "";
  c.textContent = S.timeHidden ? "––:––" : fmt(S.seconds);
  c.className = "clock" + (!S.timeHidden && S.seconds <= 60 ? " low" : "");
  $("bTime").lastChild.textContent = S.timeHidden ? " Show Time" : " Hide Time";
}
function fmt(s){
  s = Math.max(0, s);
  return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}

function renderCTW(){
  let b = -1;
  const body = M.ctw.segs.map(seg => {
    if (seg.t === "text") return esc(seg.v);
    b++;
    const i = b, n = seg.n;
    return `<span class="cw">${esc(seg.stem)}<span class="slot">` +
      `<input id="cw${i}" data-i="${i}" maxlength="${n}" size="${n}" autocomplete="off" ` +
      `spellcheck="false" style="width:calc(${n}ch + 10px)" value="${esc(S.typed[i])}" ` +
      `aria-label="Missing letters for word ${i+1}, ${n} letters">` +
      `<span class="dash">${"_".repeat(n)}</span></span></span>`;
  }).join("");
  main.innerHTML = `<p class="prompt">Fill in the missing letters in the paragraph.</p>
    <div class="ctw">${body}</div>`;
  main.querySelectorAll(".cw input").forEach(el => {
    el.addEventListener("input", e => {
      S.typed[+e.target.dataset.i] = e.target.value.replace(/[^A-Za-z']/g, "");
      e.target.value = S.typed[+e.target.dataset.i];
      renderFoot();
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); const nx = main.querySelector(`#cw${+e.target.dataset.i + 1}`); if (nx) nx.focus(); }
    });
  });
}

function optionsHTML(n, q){
  return `<div class="opts" role="radiogroup">` + q.options.map((o, i) =>
    `<label class="opt"><input type="radio" name="q${n}" value="${i}"${S.chosen[n] === i ? " checked" : ""}>` +
    `<span class="dot"></span><span class="txt">${esc(o)}</span></label>`).join("") + `</div>`;
}

function wireOptions(n){
  main.querySelectorAll(`input[name="q${n}"]`).forEach(el =>
    el.addEventListener("change", () => { S.chosen[n] = +el.value; renderFoot(); say("Answer selected."); }));
}

function renderDaily(){
  const {text, q} = dailyAt(S.qi);
  const doc = text.kind === "email"
    ? `<div class="doc"><div class="subj"><b>Subject:</b><span>${esc(text.subject)}</span></div>
         <div class="body">${text.body.map(p => `<p>${esc(p)}</p>`).join("")}</div></div>`
    : `<div class="doc notice"><div class="hd">${esc(text.subject)}</div>
         <div class="body">${text.body.map(p => `<p>${esc(p)}</p>`).join("")}</div></div>`;
  main.innerHTML = `<p class="prompt">${text.kind === "email" ? "Read an email." : "Read a notice."}</p>
    <div class="two"><div>${doc}</div>
      <div class="qcol"><p class="stem">${esc(q.stem)}</p>${optionsHTML(S.qi, q)}</div></div>`;
  wireOptions(S.qi);
}

function renderAcademic(){
  const q = acadAt(S.qi);
  const paras = M.ac.paragraphs.map(p => {
    let h = esc(p);
    if (q.highlight){
      const needle = esc(q.highlight);
      const at = h.indexOf(needle);
      if (at >= 0) h = h.slice(0, at) + `<mark>${needle}</mark>` + h.slice(at + needle.length);
    }
    return `<p>${h}</p>`;
  }).join("");
  main.innerHTML = `<p class="ptitle">${esc(M.ac.title)}</p>
    <div class="two"><div class="pass">${paras}</div>
      <div class="qcol"><p class="stem">${esc(q.stem)}</p>${optionsHTML(S.qi, q)}</div></div>`;
  wireOptions(S.qi);
}

function renderFoot(){
  if (S.screen === "report"){ foot.style.display = "none"; return; }
  foot.style.display = "";
  let done = 0;
  for (let n = 1; n <= TOTAL; n++) if (answered(n)) done++;
  const dots = Array.from({length: TOTAL}, (_, i) => {
    const n = i + 1;
    return `<button class="dot-b" data-go="${n}" data-done="${answered(n)?1:0}" ` +
      `data-cur="${S.screen==='test' && (isCTW(S.qi) ? isCTW(n) : n===S.qi) ? 1 : 0}" ` +
      `aria-label="Question ${n}">${n}</button>`;
  }).join("");
  foot.innerHTML = `<div class="foot-in"><span class="status"><b>${done}</b> of ${TOTAL} answered</span>
    <div class="dots">${dots}</div></div>`;
  foot.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    S.qi = +b.dataset.go; S.screen = "test"; render(); window.scrollTo(0,0);
  });
}

function renderReview(){
  const rows = Array.from({length: TOTAL}, (_, i) => {
    const n = i + 1;
    const task = isCTW(n) ? "Complete the Words" : n <= 15 ? "Read in Daily Life" : "Read an Academic Passage";
    return `<tr data-go="${n}"><td class="n">${n}</td><td>${task}</td>
      <td>${answered(n) ? '<span class="tag done">Answered</span>' : '<span class="tag none">Not answered</span>'}</td></tr>`;
  }).join("");
  main.innerHTML = `<div class="panel"><h1>Review your answers</h1>
    <p class="lede">Select a question to return to it. Ending the section scores your answers and you will not be able to change them.</p>
    <div class="tableWrap"><table><thead><tr><th>No.</th><th>Task</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
  main.querySelectorAll("[data-go]").forEach(tr => tr.onclick = () => {
    S.qi = +tr.dataset.go; S.screen = "test"; render(); window.scrollTo(0,0);
  });
}

function renderReport(){
  let right = 0;
  const cards = [];
  M.ctw.answers.forEach((a, i) => {
    const got = S.typed[i].trim().toLowerCase(), ok = got === a.toLowerCase();
    if (ok) right++;
    const stem = M.ctw.segs.filter(s => s.t === "blank")[i].stem;
    cards.push(`<div class="rep ${ok?"right":"wrong"}"><div class="rep-hd"><span class="n">${i+1}</span>
      <span class="ty">Complete the Words</span><span class="tag ${ok?"ok":"no"}">${ok?"Correct":"Incorrect"}</span></div>
      <p>${ok ? "" : `<span class="yours">You typed: ${got ? esc(got) : "(blank)"}</span> &middot; `}
      <span class="right-ans">${esc(stem)}<b>${esc(a)}</b></span></p></div>`);
  });
  const mc = [];
  for (let n = 11; n <= 15; n++) mc.push([n, dailyAt(n).q, "Read in Daily Life"]);
  for (let n = 16; n <= 20; n++) mc.push([n, acadAt(n), "Read an Academic Passage"]);
  mc.forEach(([n, q, task]) => {
    const got = S.chosen[n], ok = got === q.key;
    if (ok) right++;
    cards.push(`<div class="rep ${ok?"right":"wrong"}"><div class="rep-hd"><span class="n">${n}</span>
      <span class="ty">${task} &middot; ${esc(q.type)}</span>
      <span class="tag ${ok?"ok":"no"}">${ok?"Correct":"Incorrect"}</span></div>
      <p>${esc(q.stem)}</p>
      ${got === undefined ? '<p class="yours">No answer</p>' :
        ok ? `<p class="right-ans">${esc(q.options[got])}</p>` :
        `<p class="yours">You chose: ${esc(q.options[got])}</p>
         <p class="right-ans">Correct: ${esc(q.options[q.key])}</p>`}</div>`);
  });
  main.innerHTML = `<div class="panel"><h1>Score report</h1>
    <p class="lede">${S.timedOut ? "Time expired and the module was submitted automatically. " : ""}
    Every item is scored right or wrong. Complete the Words requires exact spelling.</p>
    <div class="score">
      <div><div class="big">${right}/${TOTAL}</div><div class="cap">Items correct</div></div>
      <div><div class="big">${Math.round(right/TOTAL*100)}%</div><div class="cap">Accuracy</div></div>
      <div><div class="big">${fmt(SECONDS - S.seconds)}</div><div class="cap">Time used</div></div>
    </div>${cards.join("")}</div>`;
}

/* ---------- navigation ---------- */
$("bBack").onclick = () => {
  if (S.screen !== "test") return;
  S.qi = isCTW(S.qi) ? 1 : (S.qi === 11 ? 10 : S.qi - 1);
  render(); window.scrollTo(0,0);
};
$("bNext").onclick = () => {
  if (S.screen === "report"){ restart(); return; }
  if (S.screen === "review"){ endSection(); return; }
  if (isCTW(S.qi)) S.qi = 11;
  else if (S.qi < TOTAL) S.qi++;
  else { S.screen = "review"; }
  render(); window.scrollTo(0,0);
};
$("bReview").onclick = () => {
  if (S.screen === "report") return;
  S.screen = S.screen === "review" ? "test" : "review";
  render(); window.scrollTo(0,0);
};
$("bTime").onclick = () => { S.timeHidden = !S.timeHidden; renderChrome(); };
$("bHelp").onclick = openHelp;

function endSection(){
  let left = 0;
  for (let n = 1; n <= TOTAL; n++) if (!answered(n)) left++;
  if (!confirm(left ? `${left} item${left>1?"s are":" is"} unanswered. End the section and score it?`
                    : "End the section and score it?")) return;
  clearInterval(tick);
  S.screen = "report"; render(); window.scrollTo(0,0);
}
function restart(){
  M = buildModule();
  S.screen = "test"; S.qi = 1; S.seconds = SECONDS; S.timedOut = false;
  S.typed = M.ctw.answers.map(() => "");
  S.chosen = {};
  tick = setInterval(onTick, 1000);
  render(); window.scrollTo(0,0);
}
let tick = setInterval(onTick, 1000);
function onTick(){
  if (S.screen === "report") return;
  if (--S.seconds <= 0){
    S.seconds = 0; clearInterval(tick);
    S.timedOut = true; S.screen = "report"; render(); window.scrollTo(0,0); return;
  }
  renderChrome();
}

function openHelp(){
  const d = document.createElement("div");
  d.className = "scrim";
  d.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Help">
    <header>Help &mdash; Reading</header><div class="body">
    <h3>The module</h3>
    <p>Twenty items in thirteen minutes: ten Complete the Words on one screen, five questions on everyday texts, and five on one academic passage.</p>
    <h3>Complete the Words</h3>
    <p>Type the missing letters of each word. The dashes under each box show exactly how many letters are missing. Spelling must be exact; there is no partial credit and no penalty for a wrong answer. <b>Enter</b> moves to the next box.</p>
    <h3>The reading questions</h3>
    <p>One question per screen, with the text shown beside it. Some questions highlight a word or phrase in the text.</p>
    <h3>Moving through</h3>
    <p><b>Next</b> and <b>Back</b> move between questions, <b>Review</b> lists what is unanswered, and <b>Hide Time</b> conceals the clock without stopping it.</p>
    </div><footer><button class="pill primary" id="bCloseHelp">Return</button></footer></div>`;
  document.body.appendChild(d);
  d.addEventListener("click", e => { if (e.target === d) d.remove(); });
  $("bCloseHelp").onclick = () => { d.remove(); $("bHelp").focus(); };
  $("bCloseHelp").focus();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ const d = document.querySelector(".scrim"); if (d) d.remove(); }
});

render();
</script>
</body>
</html>
